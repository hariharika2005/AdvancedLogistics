<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Advanced Logistics Fleet Monitoring</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23111827'/%3E%3Cpath d='M14 40h36M18 32h28M22 24h20' stroke='%23fbbf24' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E" />
    <style>
      html, body { height: 100%; }
      body { margin: 0; font-family: 'Inter', system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; background: #ffffff; color: #111827; }
      button { font-family: inherit; }
      /* Simple animation utilities */
      @keyframes fadeInUp { from { opacity: 0; transform: translateY(8px);} to { opacity: 1; transform: translateY(0);} }
      .fade-in { animation: fadeInUp .5s ease both; }
      .fade-in-delayed { animation: fadeInUp .7s ease both; }
      .hover-lift { transition: transform .2s ease, box-shadow .2s ease; }
      .hover-lift:hover { transform: translateY(-2px); box-shadow: 0 6px 12px rgba(0,0,0,0.08); }
      .btn-trans { transition: background .2s ease, color .2s ease, border-color .2s ease, transform .05s ease; }
      .btn-trans:active { transform: translateY(1px); }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
